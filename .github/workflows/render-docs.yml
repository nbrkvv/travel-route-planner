name: Validate and render architecture
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -fL https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar -o plantuml.jar
      - name: Test domain code
        run: python -m unittest discover -s src -v
      - name: Validate and render every standalone diagram
        run: python scripts/render_diagrams.py --jar plantuml.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-and-validation
          path: |
            diagrams/**/*.png
            diagrams/**/*.svg
            validation/
