name: Validate and render architecture
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -fL https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar -o plantuml.jar
      - name: Test diagram discovery and failure handling
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate and render all repository diagrams
        run: python scripts/validate_lab5.py --jar plantuml.jar --render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-and-validation
          path: |
            diagrams/**/*.png
            diagrams/**/*.svg
            lab5/**/*.png
            lab5/**/*.svg
            diagrams/**/*.puml
            lab5/**/*.puml
            lab5/contracts/project.json
            README.md
            validation/
